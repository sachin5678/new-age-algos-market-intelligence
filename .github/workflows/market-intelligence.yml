name: Market Intelligence

on:
  schedule:
    # Pre-market briefing: 08:30 IST = 03:00 UTC
    - cron: '0 3 * * 1-5'
    # Market monitoring: every 5 minutes from 09:15-15:30 IST = 03:45-10:00 UTC, Mon-Fri
    - cron: '*/5 3-10 * * 1-5'
    # Closing briefing: 15:45 IST = 10:15 UTC
    - cron: '15 10 * * 1-5'
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Job type to execute'
        type: choice
        required: true
        options:
          - premarket
          - market-check
          - market-news
          - closing
          - health-check
      dry_run:
        description: 'Dry run mode (no Telegram send)'
        type: boolean
        required: false
        default: true
      no_ai:
        description: 'Skip OpenAI analysis'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: market-intelligence-${{ github.event.inputs.job_type || github.event.schedule }}
  cancel-in-progress: false

jobs:
  market-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_PATH: ${{ secrets.TELEGRAM_SESSION_PATH }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python and yfinance
        run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
          pip3 install yfinance

      - name: Restore state from cache
        id: restore-state
        uses: actions/cache@v4
        with:
          path: |
            state/market.db
            state/inbox
            state/logs
          key: market-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            market-state-

      - name: Install dependencies
        run: npm ci

      - name: Run health check
        if: ${{ github.event.inputs.job_type == 'health-check' }}
        run: node src/index.js --job-type health-check

      - name: Run pre-market briefing
        if: ${{ github.event.schedule == '0 3 * * 1-5' || github.event.inputs.job_type == 'premarket' }}
        run: node src/index.js --mode premarket --briefing premarket

      - name: Run market check
        if: ${{ github.event.schedule == '*/5 3-10 * * 1-5' || github.event.inputs.job_type == 'market-check' }}
        run: node src/index.js --mode intraday --job-type market-check

      - name: Run market news
        if: ${{ github.event.inputs.job_type == 'market-news' }}
        run: node src/index.js --job-type market-news

      - name: Run closing briefing
        if: ${{ github.event.schedule == '15 10 * * 1-5' || github.event.inputs.job_type == 'closing' }}
        run: node src/index.js --mode closing --briefing closing

      - name: Save state to cache
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            state/market.db
            state/inbox
            state/logs
          key: market-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-logs
          path: state/logs/
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Market intelligence job failed - see logs artifact"

concurrency:
  group: market-intelligence-${{ github.event.inputs.job_type || github.event.schedule }}
  cancel-in-progress: false