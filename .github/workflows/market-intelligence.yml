name: Market Intelligence

on:
  # NOTE: no `schedule:` here on purpose. GitHub's scheduler never fired for this
  # account (0 runs in 26h, including a per-5-minute probe; and when it does fire
  # for this account it runs hours late). cron-job.org is the sole scheduler — it
  # calls workflow_dispatch below with an explicit job_type + target. The per-job
  # schedules live in the cron-job.org console, not here.
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Job type to execute'
        type: choice
        required: true
        options:
          - market-wrap
          - market-check
          - market-news
          - closing
          - health-check
          - premarket
          - setup-test-bot
      dry_run:
        description: 'Dry run mode (no Telegram send)'
        type: boolean
        required: false
        # Manual runs are opt-in for real sends; scheduled runs always deliver.
        default: false
      no_ai:
        description: 'Skip OpenAI analysis'
        type: boolean
        required: false
        default: false
      target:
        description: 'Where the run posts. default/test = test group; live = production channel (set by the cron-job.org job body).'
        type: choice
        required: false
        default: test
        options:
          - test
          - live

permissions:
  contents: read
  actions: read

concurrency:
  group: market-intelligence-${{ github.event.inputs.job_type || github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  market-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Every trigger is a workflow_dispatch now (cron-job.org), so DRY_RUN is
      # purely an input: omitted -> false -> real delivery.
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
      NO_AI_FLAG: ${{ github.event.inputs.no_ai == 'true' && '--no-ai' || '' }}
      # Despite the name, this carries any OpenAI-compatible key. config/settings.json
      # -> ai.baseUrl picks the endpoint; the secret name is unchanged so existing
      # repo secrets and the health-check keep working.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Bot API transport — stateless, nothing to carry between runs.
      # The TEST target is posted by the dedicated testing bot
      # (@newagealgos_test_bot) into the testing group; production uses the
      # channel bot and the production chat. Only an explicit target=live
      # reaches production.
      TELEGRAM_BOT_TOKEN: ${{ github.event.inputs.target == 'live' && secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TEST_BOT_TOKEN }}
      # Guard rail: target=live is the ONLY thing that reaches production, and it
      # must be written explicitly in the cron-job.org job body. Omitted/test ->
      # the testing bot's group.
      TELEGRAM_CHAT_ID: ${{ github.event.inputs.target == 'live' && secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_TEST_CHAT_ID }}
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python and yfinance
        run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
          pip3 install yfinance

      - name: Restore state from cache
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            state/market.db
            state/inbox
            state/logs
          key: market-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            market-state-

      - name: Install dependencies
        run: npm ci

      - name: Run health check
        if: ${{ github.event.inputs.job_type == 'health-check' }}
        run: node src/index.js --job-type health-check

      # The daily post is ONE text message (src/telegram/market-wrap.js): the
      # benchmark line, the day's top 3 gainers and top 3 losers from the
      # NIFTY 500, and the single biggest news of the day — in the
      # market-closing-wrap format readers know. The card
      # (src/visual/market-wrap-card.js) stays available with --visual, but the
      # channel posts text.
      - name: Run post-market wrap
        if: ${{ github.event.inputs.job_type == 'market-wrap' || github.event.inputs.job_type == 'closing' }}
        env:
          VISUAL_BRIEFING: 'false'
          VISUAL_PDF: 'false'
        run: node src/index.js --mode closing --briefing market-wrap ${{ env.NO_AI_FLAG }}

      # The intraday alert stream is retired: one daily post (the card above)
      # replaces it. A stray dispatch must not post the old stream again.
      - name: Market check retired (no-op)
        if: ${{ github.event.inputs.job_type == 'market-check' }}
        run: node src/index.js --mode intraday --job-type market-check

      - name: Run market news
        if: ${{ github.event.inputs.job_type == 'market-news' }}
        run: node src/index.js --job-type market-news ${{ env.NO_AI_FLAG }}

      # The pre-market summary was retired: the channel posts one post-market
      # wrap and nothing before the open. A stale dispatch must not post the
      # old format again, so this step is a no-op on purpose.
      - name: Pre-market briefing retired (no-op)
        if: ${{ github.event.inputs.job_type == 'premarket' }}
        run: node src/index.js --mode premarket --briefing premarket

      # One-off provisioning: give the dedicated TEST bot the right to post in
      # the testing group. The testing group is a supergroup, so the bot can
      # join it through the invite link the group owner exports. Safe to
      # re-run.
      - name: Provision test bot
        if: ${{ github.event.inputs.job_type == 'setup-test-bot' }}
        env:
          PROD_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
          TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
        run: |
          set -euo pipefail
          test_id=$(curl -sS "https://api.telegram.org/bot${TEST_BOT_TOKEN}/getMe" | jq -r .result.id)
          echo "test bot id: ${test_id}  chat: ${TEST_CHAT_ID}"
          echo "--- 0. what can the production bot do there? ---"
          curl -sS "https://api.telegram.org/bot${PROD_BOT_TOKEN}/getChatAdministrators?chat_id=${TEST_CHAT_ID}" | jq -c '.result[] | {user: .user.username, status: .status, rights: .can_post_messages, invite: .can_invite_users, promote: .can_promote_members, admin: .is_admin}' || true
          echo "--- 1. bot-created invite link (the production bot is an admin there) ---"
          link=$(curl -sS -X POST "https://api.telegram.org/bot${PROD_BOT_TOKEN}/createChatInviteLink" \
            -H 'Content-Type: application/json' -d "{\"chat_id\":${TEST_CHAT_ID}}" | tee /dev/stderr | jq -r '.result.invite_link // empty')
          echo "--- 2. the test bot joins through it ---"
          if [ -n "${link}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TEST_BOT_TOKEN}/joinChat" \
              -H 'Content-Type: application/json' -d "{\"invite_link\":\"${link}\"}"
            echo
            echo "--- 3. approve the join request (channel has join requests on) ---"
            curl -sS -X POST "https://api.telegram.org/bot${PROD_BOT_TOKEN}/approveChatJoinRequest" \
              -H 'Content-Type: application/json' -d "{\"chat_id\":${TEST_CHAT_ID},\"user_id\":${test_id}}" || true
            echo
          fi
          echo "--- 4. promote so it can post ---"
          curl -sS -X POST "https://api.telegram.org/bot${PROD_BOT_TOKEN}/promoteChatMember" \
            -H 'Content-Type: application/json' \
            -d "{\"chat_id\":${TEST_CHAT_ID},\"user_id\":${test_id},\"can_post_messages\":true,\"can_manage_chat\":false,\"can_delete_messages\":false,\"can_restrict_members\":false,\"can_promote_members\":false,\"can_change_info\":false,\"can_invite_users\":false,\"can_pin_messages\":false,\"is_anonymous\":false}" || true
          echo
          echo "--- 5. verify + ping ---"
          curl -sS "https://api.telegram.org/bot${TEST_BOT_TOKEN}/getChat?chat_id=${TEST_CHAT_ID}" | jq -c '{ok, title: .result.title, type: .result.type}'
          curl -sS -X POST "https://api.telegram.org/bot${TEST_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "{\"chat_id\":${TEST_CHAT_ID},\"text\":\"🤖 Test bot online — test messages land here from now on.\"}" || true
          echo

      - name: Save state to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/market.db
            state/inbox
            state/logs
          key: market-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload visual briefings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-briefings
          path: artifacts/briefings/
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-logs
          path: state/logs/
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Market intelligence job failed - see logs artifact"
