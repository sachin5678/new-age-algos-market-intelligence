name: Schedule Probe

# TEMPORARY diagnostic: does GitHub's scheduler fire in this repository at all?
# Echo only — this workflow has no Telegram/secret access and posts nothing.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Echo
        run: echo "PROBE fired event=${GITHUB_EVENT_NAME} at $(date -u +%FT%TZ)"
