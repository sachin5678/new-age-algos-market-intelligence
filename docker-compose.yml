version: '3.8'

services:
  new-age-algos:
    build: .
    container_name: new-age-algos
    restart: unless-stopped
    environment:
      - DRY_RUN=${DRY_RUN:-false}
      - OPENAI_API_KEY_FILE=/app/secrets/openai-key
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_SESSION_PATH=/app/state/telegram-session
      - EVENT_POLL_INTERVAL_MINUTES=5
      - MAX_ALERTS_PER_HOUR=3
      - NODE_ENV=production
    volumes:
      - ./state:/app/state
      - ./config:/app/config
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('OK')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Redis for distributed locking if scaling
  # redis:
  #   image: redis:7-alpine
  #   volumes:
  #     - redis-data:/data

